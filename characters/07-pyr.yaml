slot: 7
code: PYR
name: Pyre
archetype: vulture
colorset: 6

# Dial re-rolls (ZED's mechanic): none.
reroll_interval_s: null
reroll_seed_from_match: false
ranges: null

perception:
  reaction_time_ms: 140
  aim_accuracy: 0.7
  max_turn_deg_per_tic: 12

temperament:
  aggression: 0.7
  self_preservation: 0.5
  engage_health_min: 30
  preferred_range: [64, 256]
  flank: true   # path scoring penalizes approaching inside the target's view cone
  retreat_distance: null
  engage_only:   # the Vulture: fights only someone already in a fight, keeps away from everyone else
    busy: true   # seen aiming at another player
    hurt_within_ms: 3000   # or seen bleeding in the last 3 s

behavior_weights:
  HUNTING: 0.8
  ROAMING: 0.5
  STALKING: 0.2
  HOLDING_ANGLE: 0.0
  COLLECTING_ARMOR: 0.5   # 1.0 as the flanker, whose signature was armor pickups
  COLLECTING_HEALTH: 0.5
  FLEEING: 0.4

weapons:
  allowed: [super_shotgun, shotgun, pistol]
  weights: {super_shotgun: 1.0, shotgun: 0.5, pistol: 0.1}

items:
  item_timing: false
  weights: {ammo: 0.4, health: 0.5, armor: 1.0, megasphere: 0.8, berserk: 0.0}

spots: null

signature:
  - metric: third_party_kill_share   # victim was fighting another slot or hurt by one in the 3 s before
    op: ">="
    value: 0.6
    gate: true
  - metric: first_contact_avoidance_share   # fresh enemies in view it does not take on
    op: ">="
    value: 0.5
    gate: false
