slot: 3
code: NUL
name: "Null"
archetype: ambusher
colorset: 2

# Dial re-rolls (ZED's mechanic): none.
reroll_interval_s: null
reroll_seed_from_match: false
ranges: null

perception:
  reaction_time_ms: 100
  aim_accuracy: 0.85
  max_turn_deg_per_tic: 12

temperament:
  aggression: 0.5
  self_preservation: 0.4
  engage_health_min: 0
  preferred_range: [200, 600]   # outside rocket self-splash
  retreat_distance: null
  flank: false

behavior_weights:
  HUNTING: 0.1
  ROAMING: 0.3
  STALKING: 1.0
  HOLDING_ANGLE: 0.0
  COLLECTING_ARMOR: 0.3
  COLLECTING_HEALTH: 0.4
  FLEEING: 0.3

weapons:
  allowed: [rocket_launcher, shotgun, pistol]
  weights: {rocket_launcher: 1.0, shotgun: 0.3, pistol: 0.1}

items:
  item_timing: false
  weights: {ammo: 0.6, health: 0.4, armor: 0.3, megasphere: 0.4, berserk: 0.0}

spots:
  mode: sightlines_min_near_traffic
  hold_label: STALKING
  fire_only_when_visible_ms: 1000   # fires within 1s of target appearing
  leave_when:
    - health_below: 40
    - no_contact_seconds: 45
    - ammo_empty: true

signature:
  - metric: frags_within_1500ms_of_visibility_share
    op: ">="
    value: 0.5
    gate: false   # placeholders pass it too (docs/SIGNATURES.md, separation)
  - metric: distance_traveled_rank   # 1 = least of the 8
    op: "<="
    value: 2   # fit-2d: fitted on eval-2c (tools/fit_thresholds.py); was 2
    gate: true   # milestone 2D: separates against the roster (2C: 10/10, the other seven 14% on each map)
  - metric: kills_from_hold_share   # kills after 70+ tics within 16 units of the kill spot
    op: ">="
    value: 0.3   # fit-2d: fitted on eval-2c (tools/fit_thresholds.py); was 0.5
    gate: true   # separates on both 2B maps; placeholders 0/67
