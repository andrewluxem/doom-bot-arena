<!doctype html>
<html data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Option B — Phone</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../dba.css"><script src="../dba.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:var(--surface-0)}
.brand{display:flex;flex-direction:column;gap:5px;white-space:nowrap}
.brand-t{font:800 20px/1 var(--font-display);letter-spacing:.07em}
.brand-s{font:500 9px/1 var(--font-mono);letter-spacing:.1em;color:var(--ink-muted)}
.panel{border:1px solid var(--rule);background:var(--surface-1);padding:10px 12px;min-width:0;min-height:0;overflow:hidden}
.panel>.kick{display:block;margin-bottom:8px}
.feat{font:500 10px/1.5 var(--font-mono);letter-spacing:.05em;color:var(--ink-muted);border-top:1px solid var(--rule-soft);padding-top:8px;margin-top:10px}
.feat b{color:var(--ink);font-weight:700}.ph{width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ph-top{height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--rule)}
.ph-top .brand-t{font-size:16px}
.ph-top .clk-t{font-size:22px}
.ph-top .clk-of{display:none}
.drawer{flex:none;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-bottom:1px solid var(--rule);background:var(--surface-1);white-space:nowrap;overflow:hidden}
.drawer .kick{font-size:11px;color:var(--ink)}
.drawer .ldr{display:flex;gap:10px;font:600 11px/1 var(--font-mono);overflow:hidden}
.drawer .ldr span{display:inline-flex;align-items:center;gap:4px}
.drawer .ldr .sw{width:7px;height:7px}
.drawer .chev{margin-left:auto;font:600 11px/1 var(--font-mono);color:var(--ink-muted)}
.ph-dock{position:absolute;left:0;right:0;bottom:0;height:100px;display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:6px;padding:6px;border-top:1px solid var(--rule-strong);background:var(--surface-0)}
.ph-dock .tlp{padding:8px 8px 6px}
.ph-dock .mm-hd{height:16px;font-size:8px;padding:0 5px}

.pb-map{flex:none;padding:6px 8px 0}
.pb-map .mm-panel .mm{aspect-ratio:4/3}
.pb-strip-h{display:flex;justify-content:space-between;padding:8px 8px 5px;font:600 9px/1 var(--font-mono);letter-spacing:.12em;color:var(--ink-muted)}
.pb-strip{flex:none;display:flex;gap:4px;overflow:hidden;padding:0 8px}
.pb-strip .tile{flex:0 0 150px}
.pb-drawer{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:8px;border-top:1px solid var(--rule-strong);background:var(--surface-1)}
.pb-drawer .drawer{border-bottom:1px solid var(--rule);background:var(--surface-2)}
.pb-drawer .sb-table{padding:0}
.pb-drawer .tb{padding:6px 10px 0}
.pb-drawer .sb-table td{height:21px}
.pb-tl{padding:8px 10px 6px;border-top:1px solid var(--rule)}

</style></head>
<body>
<div id="root" class="dba ph" data-theme="dark"></div>
<script>
(function(){var D=window.DBA;
var ORDER=['01','02','05','06','08','04','07','03'],SEC={'07':'NW','03':'N','01':'C\u00B7W','04':'W','05':'NE','02':'C\u00B7E','06':'SE','08':'S'};
var r=document.getElementById('root');r.innerHTML='<header class="ph-top"><span class="brand-t">DOOM BOT ARENA</span>'+D.clock()+'</header>'
+'<div class="pb-map">'+D.mapPanel({ls:13,r:6,cone:46,callsigns:false,tap:true,hint:false})+'</div>'
+'<div class="pb-strip-h"><span>FEEDS BY SECTOR \u00B7 FROM HALL, CLOCKWISE</span><span>8 \u2192</span></div>'
+'<section class="pb-strip">'+ORDER.map(function(id){return D.tile(id,{size:'s',sector:SEC[id]})}).join('')+'</section>'
+'<section class="pb-drawer"><div class="drawer" role="button" aria-expanded="true"><span class="kick">STANDINGS</span><span class="chev">\u25B4 CLOSE</span></div><div class="tb">'+D.scoreTable()+'</div><div class="pb-tl">'+D.timeline({buckets:50,compact:true,noHead:true,stack:3})+'</div></section>';
})();
</script>
</body>
</html>
