<!doctype html>
<html data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimap</title><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../dba.css"><script src="../dba.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:var(--surface-0)}
.wrap{padding:20px;display:grid;grid-template-columns:260px 1fr;gap:24px;width:1040px;align-items:end}
.lbl{font:600 10px/1 var(--font-mono);letter-spacing:.12em;color:var(--ink-muted);margin-bottom:8px;display:block}

</style></head>
<body>
<div id="root" class="dba"></div>
<script>
(function(){var D=window.DBA;
document.getElementById('root').innerHTML='<div class="wrap"><div><span class="lbl">PINNED (DOCK)</span>'+D.mapPanel({ls:16,r:6})+'</div><div><span class="lbl">EXPANDED</span>'+D.mapPanel({expanded:true,ls:8,r:4,callsigns:true,sectors:true,secSize:6.5})+'</div></div>';
})();
</script>
</body>
</html>
